name: CI

# Phase 6 (CHANGES-fork.md) rewrite: this fork targets esp-idf >= 6.0 only,
# on the esp32 chip family (esp32/esp32s2/esp32s3/esp32c3). The previous
# version of this workflow built a matrix of esp-idf 4.0.x-4.4.x, master,
# and ESP8266 RTOS SDK, none of which this fork supports any more -- see
# CHANGES-fork.md's "Scope fork to esp-idf >= 6.0, esp32 family only".
#
# Uses espressif/idf's official Docker images (pre-built per esp-idf
# release, so no manual toolchain-install/cache dance like the old
# workflow needed) pinned to this fork's exact esp-idf version
# (6.0.2 -- see ../../CMakeLists.txt's IDF_VERSION_MAJOR check and
# src/esp_wireguard.c's CONFIG_* usage, both esp-idf-6.0-specific).
#
# NOTE: written and reviewed in a cloud sandbox with no Docker and no
# network access to Docker Hub or GitHub's own runners, so this workflow
# could not actually be executed before being committed -- only the
# examples/demo build itself was verified locally (see CHANGES-fork.md,
# Phase 5/6), with the xtensa (esp32) toolchain only. Watch the first real
# run of this workflow on GitHub.

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  idf-build:
    name: Build examples/demo (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
          - esp32s2
          - esp32s3
          - esp32c3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          cd examples/demo
          idf.py set-target ${{ matrix.target }}
          idf.py build

  host-tests:
    name: Host-side crypto tests and packet-parser fuzzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang python3-pip

      - name: Install the libFuzzer/ASan runtime matching this runner's clang
        # The package name is versioned to clang's own major version
        # (e.g. libclang-rt-18-dev for clang 18), which varies by Ubuntu
        # release -- so this is resolved at run time rather than pinned.
        run: |
          CLANG_MAJOR="$(clang --version | grep -oP 'clang version \K[0-9]+')"
          sudo apt-get install -y "libclang-rt-${CLANG_MAJOR}-dev"

      - name: Crypto primitive tests against known-answer vectors (gcc)
        run: |
          make -C host-tests check

      - name: Crypto primitive tests under ASan+UBSan
        run: |
          make -C host-tests asan

      - name: Packet-parser fuzz harness - bounded smoke run (clang + libFuzzer)
        # A fixed time budget, not "until a crash is found": this is a
        # regression smoke test (did a change introduce an immediate
        # crash?), not a substitute for a real, long-running fuzzing
        # campaign. See host-tests/fuzz/README.md for scope and the
        # ~20,600-execution/2-minute baseline this was checked against.
        run: |
          make -C host-tests/fuzz fuzz CC=clang
          make -C host-tests/fuzz run SECS=120 CC=clang

      - name: Upload fuzz corpus/crashes (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            host-tests/fuzz/corpus
            host-tests/fuzz/crash-*
            host-tests/fuzz/leak-*
            host-tests/fuzz/timeout-*
          if-no-files-found: ignore

  # Hardware-in-the-loop tests against a real peer (CHANGES-fork.md, Phase
  # 6) need a self-hosted runner with real ESP32 hardware attached and a
  # reachable WireGuard peer -- not available yet. No job here; add one
  # (likely `runs-on: [self-hosted, esp32-hil]`, flashing examples/demo and
  # driving it over serial) once that runner exists.

  all-build:
    # A single, stable required-status-check name regardless of how the
    # matrix above changes. See the old workflow's own comment for why
    # this pattern is used (also linked there):
    # https://github.com/jazzband/pip-tools/issues/1085#issuecomment-619172509
    name: All build
    runs-on: ubuntu-latest
    needs:
      - idf-build
      - host-tests
    steps:
      - run: echo "All builds finished"
