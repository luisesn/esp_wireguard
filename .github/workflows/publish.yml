---

name: Push component to https://components.espressif.com
on:
  push:
    tags:
      - v*
jobs:
  upload_components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@b78a19fa5424714997596d3ecffa634aef8ae20b
        with:
          name: "esp_wireguard"
          version: ${{ github.ref_name }}
          # This fork publishes under its own namespace, not upstream's
          # ("trombik") -- this repo has no permission to overwrite that
          # listing, and publishing a narrower-scope fork under the
          # original author's name would be misleading regardless.
          namespace: "luisesn"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
